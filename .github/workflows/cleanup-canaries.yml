name: Cleanup lab canaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'daridor9/hyperlane-ci-permission-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete only guarded lab refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cleanup_prefix() {
            prefix="$1"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${prefix}" \
              --jq '.[].ref' |
            while IFS= read -r ref; do
              case "$ref" in
                refs/tags/agents-lab-canary-*|refs/tags/e2e-canary-*)
                  encoded="${ref#refs/}"
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${encoded}"
                  ;;
                *)
                  echo "refusing unexpected ref: $ref" >&2
                  exit 1
                  ;;
              esac
            done
          }
          cleanup_prefix agents-lab-canary-
          cleanup_prefix e2e-canary-
